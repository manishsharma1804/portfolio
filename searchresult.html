<!DOCTYPE html>
<html lang="en">
   <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>Search Blogs</title>
      <link rel="stylesheet" href="style.css" />
      <link rel="stylesheet" href="mediaqueries.css" />
      <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
      <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
      <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
      <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
   </head>
   <body>
      <!-- Navigation -->
      <nav id="desktop-nav">
         <div class="logo">Manish Sharma
            <button id="dark-mode-toggle">
            <i class="fa-solid fa-sun" id="sun-icon"></i>
            <i class="fa-solid fa-moon" id="moon-icon"></i>
            </button>
         </div>
         <ul class="nav-links">
            <li><a href="index.html#about">About</a></li>
            <li><a href="index.html#experience">Experience</a></li>
            <li><a href="index.html#projects">Projects</a></li>
            <li><a href="index.html#contact">Contact</a></li>
            <li><a href="blogsList.html">Blog</a></li>
            <li>
            </li>
         </ul>
      </nav>
      <div id="mySidenav" class="sidenav">
         <a href="javascript:void(0)" class="closebtn" onclick="closeNav()">&times;</a>
         <a href="index.html#profile" onclick="closeNav()">Home</a>
         <a href="index.html#about" onclick="closeNav()">About</a>
         <a href="index.html#experience" onclick="closeNav()">Experience</a>
         <a href="index.html#projects" onclick="closeNav()">Projects</a>
         <a href="index.html#contact" onclick="closeNav()">Contact</a>
         <a href="blogsList.html" onclick="closeNav()">Blog</a>
      </div>
      <!-- Overlay background -->
      <div id="overlay" onclick="closeNav()"></div>
      <div class="sidenavv">
         <h2><span class="btnn" style="font: size 1rem;cursor:pointer;" onclick="openNav()"><i class="fa-solid fa-bars"></i></span>
            <button id="dark-mode-togglee">
            <i class="fa-solid fa-sun" id="sun-icon"></i>
            <i class="fa-solid fa-moon" id="moon-icon"></i>
            </button> 
         </h2>
      </div>
      <!--Search Bar-->
      <section id="search-section">
         <div class="search-container">
            <input type="text" id="search-input" placeholder="Search blogs..." />
            <button id="search-button"><i class="fas fa-search"></i></button>
         </div>
      </section>
      <!--Search Result-->
      <section id="search-results">
         <p class="section__text__p1">Search Results</p>
         <h1 class="title"></h1>
         <div id="results-container">
            <!-- Results will be dynamically inserted here -->
         </div>
         <p id="no-results" style="display: none;">No blogs found.</p>
      </section>
      <!-- Footer -->
      <footer>
         <p>Copyright &#169; 2024 Manish Sharma.</p>
      </footer>
      <script>
         document.getElementById('search-button').addEventListener('click', function() {
             const query = document.getElementById('search-input').value;
             if (query) {
                 window.location.href = `searchresult.html?query=${encodeURIComponent(query)}`;
             }
         });
         
         function getQueryParameter(name) {
             const urlParams = new URLSearchParams(window.location.search);
             return urlParams.get(name);
         }
         
         function displayResults(results) {
             const resultsContainer = document.getElementById('results-container');
             const noResults = document.getElementById('no-results');
         
             if (results.length > 0) {
                 noResults.style.display = 'none';
                 resultsContainer.innerHTML = results.map(result => `
                     <div class="result-item">
                         <a href="${result.url}" class="blog-link">
                             <div class="detailsss-container">
                                 <h3>Blog Title: ${result.title}</h3>
                                 <p><strong>Author:</strong> ${result.author}</p>
                                 <p><strong>Date:</strong> ${result.date}</p>
                                 <p><strong>Introduction:</strong> ${result.introduction}</p>
                             </div>
                         </a>
                     </div>
                 `).join('');
             } else {
                 noResults.style.display = 'block';
                 resultsContainer.innerHTML = '';
             }
         }
         
         document.addEventListener('DOMContentLoaded', function() {
             const query = getQueryParameter('query');
             if (query) {
                 fetch('blogs.json')
                     .then(response => response.json())
                     .then(data => {
                         // Filter blogs based on query
                         const results = data.filter(blog =>
                             blog.title.toLowerCase().includes(query.toLowerCase())
                         );
                         
                         displayResults(results);
                     })
                     .catch(error => {
                         console.error('Error fetching the blog data:', error);
                     });
             }
         });
         document.addEventListener("keydown", function(event) {
         if (event.key === "Enter") {  // Check if the "Enter" key was pressed
         document.getElementById("search-button").click();  // Trigger the button click
         }
         });
      </script>    
      <script src="script.js"></script>
   </body>
</html>
