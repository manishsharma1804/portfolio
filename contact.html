<!DOCTYPE html>

<head>

    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="mediaqueries.css" />
    <style>
        .contact-form-container {
            margin-top: 2em;
        }

        .contact-form-container h2 {
            margin-bottom: 1em;
        }

        .contact-form-container form {
            display: flex;
            flex-direction: column;
        }

        .form-group {
            margin-bottom: 1em;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5em;
            font-weight: bold;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 0.5em;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        .form-row {
            display: flex;
            gap: 1em; /* Adjust the space between input fields */
            margin-bottom: 1em;
        }

        .form-row .form-group {
            flex: 1; /* Make input fields take up equal space */
        }

        .form-group textarea {
            resize: vertical;
        }

        button[type="submit"] {
            background-color: var(--btn-color-1);
            color: white;
            padding: 0.5em 1em;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            align-self: flex-start; /* Align button to the start */
        }

        button[type="submit"]:hover {
            background-color: var(--btn-color-1-hover);
        }
    </style>
</head>

    <!-- Profile Section -->
    <section id="profile">
        <div class="section__pic-container">
            <img src="./assets/profile-pic.png" alt="Profile picture" />
        </div>
        <div class="section__text">
            <p class="section__text__p1">Hello, I'm</p>
            <h1 class="title">Manish Sharma</h1>
            <p class="section__text__p2">Web Developer</p>
            <div class="btn-container">
                <button class="btn btn-color-2" onclick="window.open('./assets/resume.pdf')">Download CV</button>
                <button class="btn btn-color-1" onclick="location.href='#contact'">Contact Info</button>
            </div>
            <div id="socials-container">
                <img src="./assets/linkedin.png" alt="LinkedIn profile" class="icon" onclick="window.open('https://www.linkedin.com/in/manishsharma18/', '_blank')" />

    <!-- Contact Section -->
    <section id="contact">
        <p class="section__text__p1">Get in Touch</p>
        <h1 class="title">Contact Me</h1>
        <div class="contact-info-upper-container">
        
        <div class="contact-form-container">
            <h2>Contact Form</h2>
            <form action="submit_form.php" method="POST">
                <div class="form-row">
                    <div class="form-group">
                        <label for="name">Name:</label>
                        <input type="text" id="name" name="name" required />
                    </div>
                    <div class="form-group">
                        <label for="email">Email:</label>
                        <input type="email" id="email" name="email" required />
                    </div>
                </div>
                <div class="form-group">
                    <label for="message">Message:</label>
                    <textarea id="message" name="message" rows="4" required></textarea>
                </div>
                <button type="submit" class="btn btn-color-1">Send Message</button>
            </form>
        </div>
    </div>
