      <script>
         document.getElementById('search-button1').addEventListener('click', function() {
             const query = document.getElementById('search-input').value;
             if (query) {
                 window.location.href = `projectsearch.html?query=${encodeURIComponent(query)}`;
             }
         });
         
         document.addEventListener("keydown", function(event) {
             if (event.key === "Enter") {  // Check if the "Enter" key was pressed
                 document.getElementById('search-button1').click();  // Trigger the button click
             }
         });
      </script>
