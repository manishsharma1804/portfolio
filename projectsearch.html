<!DOCTYPE html>
<html lang="en">
   <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>Project Search Results</title>
      <link rel="stylesheet" href="style.css" />
      <link rel="stylesheet" href="mediaqueries.css">
      <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
      <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
      <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
      <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
      <style>
         /* CSS for 3 items per row */
         .about-containers {
         display: grid;
         grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
         gap: 20px;
         }
         .details-container {
         border: 1px solid #ccc;
         border-radius: 8px;
         padding: 10px;
         box-shadow: 0 4px 8px rgba(0,0,0,0.1);
         text-align: center;
         }
         .project-img {
         width: 100%;
         height: auto;
         border-radius: 8px;
         }
         .btn-container {
         margin-top: 10px;
         }
         .btn {
         padding: 10px 15px;
         border: none;
         border-radius: 5px;
         cursor: pointer;
         margin: 5px;
         }
      </style>
   </head>
   <body>
      <!-- Navigation -->
      <nav id="desktop-nav">
         <div class="logo">Manish Sharma
            <button id="dark-mode-toggle">
            <i class="fa-solid fa-sun" id="sun-icon"></i>
            <i class="fa-solid fa-moon" id="moon-icon"></i>
            </button>
         </div>
         <ul class="nav-links">
            <li><a href="index.html#profile">Home</a></li>
            <li><a href="index.html#about">About</a></li>
            <li><a href="index.html#experience">Experience</a></li>
            <li><a href="index.html#skills">Skills</a></li>
            <li><a href="index.html#projects">Projects</a></li>
            <li><a href="index.html#contact">Contact</a></li>
            <li><a href="index.html#blog">Blog</a></li>
            <li>
            </li>
         </ul>
      </nav>
      <div id="mySidenav" class="sidenav">
         <a href="javascript:void(0)" class="closebtn" onclick="closeNav()">&times;</a>
         <a href="index.html#profile" onclick="closeNav()">Home</a>
         <a href="index.html#about" onclick="closeNav()">About</a>
         <a href="index.html#experience" onclick="closeNav()">Experience</a>
         <a href="index.html#projects" onclick="closeNav()">Projects</a>
         <a href="index.html#contact" onclick="closeNav()">Contact</a>
         <a href="blogsList.html" onclick="closeNav()">Blog</a>
      </div>
      <!-- Overlay background -->
      <div id="overlay" onclick="closeNav()"></div>
      <div class="sidenavv">
         <h2><span class="btnn" style="font: size 1rem;cursor:pointer;" onclick="openNav()"><i class="fa-solid fa-bars"></i></span>
            <button id="dark-mode-togglee">
            <i class="fa-solid fa-sun" id="sun-icon"></i>
            <i class="fa-solid fa-moon" id="moon-icon"></i>
            </button>
         </h2>
      </div>
      <section id="search-section">
         <div class="search-container">
            <input type="text" class="projsearch" name="search-input" id="search-inputt" placeholder="Search Projects.." />
            <button name="search-button" id="searchButton"><i class="fas fa-search"></i></button>
         </div>
      </section>
      <!-- Projects Section -->
      <section id="projects">
         <p class="section__text__p1">Search Results</p>
         <p name="no-results" style="display:none;">No projects found</p>
         <div name="projects-container" class="about-containers">
            <!-- Project items will be dynamically inserted here -->
         </div>
      </section>
      <!-- Footer -->
      <footer>
         <p>Copyright &#169; 2024 Manish Sharma.</p>
      </footer>
      <script>
         document.addEventListener('DOMContentLoaded', function() {
             // Access elements by name
             const searchButton = document.getElementsByName('search-button')[0];
             const searchInput = document.getElementsByName('search-input')[0];
             const projectsContainer = document.getElementsByName('projects-container')[0];
             const noProjects = document.getElementsByName('no-results')[0];
         
             // Check if elements exist
             if (searchButton && searchInput) {
                 // Event listener for the search button
                 searchButton.addEventListener('click', function() {
                     const query = searchInput.value;
                     if (query) {
                         window.location.href = `projectsearch.html?query=${encodeURIComponent(query)}`;
                     }
                 });
             } else {
                 console.error('Search button or input not found');
             }
         
             // Event listener for "Enter" key press
             document.addEventListener('keydown', function(event) {
                 if (event.key === "Enter" && searchButton) {
                     searchButton.click();
                 }
             });
         
             // Function to get query parameters from the URL
             function getQueryParameter(name) {
                 const urlParams = new URLSearchParams(window.location.search);
                 return urlParams.get(name);
             }
         
             // Function to display projects
             function displayProjects(projects) {
                 if (projectsContainer) {
                     if (noProjects) {
                         if (projects.length > 0) {
                             noProjects.style.display = 'none';
                             projectsContainer.innerHTML = projects.map(project => `
                                 <div class="details-container color-container">
                                     <div class="article-container">
                                         <img src="${project.imageUrl}" alt="${project.title}" class="project-img" />
                                     </div>
                                     <h2 class="experience-sub-title project-title">${project.title}</h2>
                                     <div class="btn-container">
                                         <button class="btn btn-color-2 project-btn" onclick="window.open('${project.githubUrl}', '_blank')">Github</button>
                                         <button class="btn btn-color-2 project-btn" onclick="window.open('${project.liveDemoUrl}', '_blank')">Live Demo</button>
                                     </div>
                                 </div>
                             `).join('');
                         } else {
                             noProjects.style.display = 'block';
                             projectsContainer.innerHTML = '';
                         }
                     } else {
                         console.error('No results element not found');
                     }
                 } else {
                     console.error('Projects container not found');
                 }
             }
         
             // Fetch and display projects based on query
             const query = getQueryParameter('query');
             if (query) {
                 fetch('projects.json')
                     .then(response => response.json())
                     .then(data => {
                         const results = data.filter(project =>
                             project.title.toLowerCase().includes(query.toLowerCase())
                         );
                         displayProjects(results);
                     })
                     .catch(error => {
                         console.error('Error fetching the project data:', error);
                     });
             }
         });
      </script>
      <script src="script.js"></script>
   </body>
</html>
